# Render Blueprint for the API. The database lives on Neon (free Postgres); paste its URL into DATABASE_URL.
services:
  - type: web
    name: job-copilot-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @copilot/shared build && pnpm --filter api build
    startCommand: pnpm --filter api db:deploy && node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: claude
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_DAILY_LIMIT
        value: "150"
      # Only these emails use real Claude; everyone else gets the free simulated model.
      - key: REAL_LLM_EMAILS
        sync: false
